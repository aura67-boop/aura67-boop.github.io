<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuff Games — Hub de Jeux</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1b2442 0%, #0b0e17 70%);
      color: #f3f6ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }
    h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
      animation: floatTitle 3.5s ease-in-out infinite;
    }
    p.subtitle {
      color: #9fb0d9;
      margin-bottom: 2.5rem;
      font-size: 1.05rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: #638cff;
      box-shadow: 0 14px 32px rgba(99, 140, 255, 0.2);
    }
    .card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
    .card p { color: #a7b6d8; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .btn {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      border-radius: 10px;
      background: #4f7cff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn:hover { background: #6b91ff; transform: scale(1.03); }
    @keyframes floatTitle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <h1>TUFF GAMES</h1>
  <p class="subtitle">Tous mes jeux HTML jouables directement dans le navigateur</p>
  <div class="grid">
    <div class="card">
      <h2>Pelican Meadows</h2>
      <p>Version v1.34 — Lance le jeu directement dans ton navigateur.</p>
      <a class="btn" href="./pelican-meadows_v1.34.html">Jouer</a>
    </div>
  </div>
</body>
</html>
